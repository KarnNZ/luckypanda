name: LP-WEB-ANIM-01 Authorised Video Import

on:
  push:
    branches: [feat/lp-web-anim01-hero-loop-20261104]
    paths: [.github/workflows/lp-hero-import.yml]

permissions:
  contents: write

jobs:
  import-authorised-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/lp-web-anim01-hero-loop-20261104
          persist-credentials: true
      - name: Retrieve exact owner-supplied animation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/brand
          curl --fail --location --silent --show-error --retry 2 --max-time 90 \
            'https://assets.grok.com/users/a6b700f7-04d3-4f78-ae54-4d386c94b822/generated/00d760a4-52cc-4a18-bf60-b9eb91d28f05/generated_video.mp4' \
            --output /tmp/lucky-panda-owner-source.mp4
          echo '6e903efc964598b804dabd0c72da48880327617eefb5ceff35b4fae99364fbea  /tmp/lucky-panda-owner-source.mp4' | sha256sum -c -
      - name: Produce small web-ready MP4 and matching still
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -y -hide_banner -loglevel error \
            -i /tmp/lucky-panda-owner-source.mp4 -an \
            -vf 'fps=30,scale=512:512:flags=lanczos' \
            -c:v libx264 -pix_fmt yuv420p -preset medium -crf 30 \
            -movflags +faststart public/brand/lucky-panda-hero.mp4
          ffmpeg -y -hide_banner -loglevel error -i /tmp/lucky-panda-owner-source.mp4 \
            -frames:v 1 -vf 'scale=512:512:flags=lanczos' \
            -c:v libwebp -quality 83 public/brand/lucky-panda-hero-poster.webp
          test -s public/brand/lucky-panda-hero.mp4
          test -s public/brand/lucky-panda-hero-poster.webp
          ffprobe -v error -show_entries format=duration -of csv=p=0 public/brand/lucky-panda-hero.mp4
          du -h public/brand/lucky-panda-hero.*
      - name: Commit media to isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/lucky-panda-hero.mp4 public/brand/lucky-panda-hero-poster.webp
          git commit -m 'assets(lucky-panda): import verified original hero video with local poster'
          git push origin HEAD:refs/heads/feat/lp-web-anim01-hero-loop-20261104
